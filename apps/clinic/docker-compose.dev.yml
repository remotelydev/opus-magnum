# Local PostgreSQL for development only. Production setup is separate (see docs).
#   docker compose -f docker-compose.dev.yml up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: clinic
      POSTGRES_DB: clinic
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - clinic-dev-db:/var/lib/postgresql/data
volumes:
  clinic-dev-db:
