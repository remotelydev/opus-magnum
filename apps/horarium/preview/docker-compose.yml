# Horarium preview on the Mac with made-up demo data. Started and updated by preview/watch.sh
# (installed with preview/install.sh). Its own database: never point this at the clinic database.
# watch.sh uses its own copy of this file (in .preview) and points HORARIUM_SRC at the checkout it builds.
# Shared publicly only on demand with preview/share.sh.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: horarium
      POSTGRES_PASSWORD: horarium
      POSTGRES_DB: horarium_preview
    volumes:
      - preview-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "horarium"]
      interval: 2s
      retries: 30
  app:
    build:
      context: ${HORARIUM_SRC:-../../..}
      dockerfile: apps/horarium/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://horarium:horarium@db:5432/horarium_preview
      CLINIC_PASSWORD: ${CLINIC_PASSWORD:?CLINIC_PASSWORD missing in .preview/.env}
    ports:
      - "127.0.0.1:8791:8790"
    depends_on:
      db:
        condition: service_healthy
volumes:
  preview-db:
